<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown — Dan Mullin</title>
  <meta name="description" content="A countdown timer in the browser. Set hours, minutes, and seconds. Nothing is uploaded.">
  <link rel="canonical" href="https://danmull.in/utilities/countdown">
  <meta name="theme-color" content="#0d0221">
  <link rel="alternate" type="text/markdown" href="/utilities/countdown.md">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header class="site-header site-header-minimal">
    <a class="logo" href="/">
      <span class="logo-mark" aria-hidden="true">⬡</span>
      <span class="logo-word"><span class="logo-name">danmull</span><span class="logo-tld">.in</span></span>
    </a>
  </header>

  <main>
    <header class="page-hero">
      <p class="hero-eyebrow"><a href="/utilities">Utilities</a></p>
      <h1>Countdown</h1>
      <p>Set a time. The tab keeps it until it reaches zero.</p>
    </header>

    <section class="section watch">
      <form id="count-form" class="tool-fields">
        <label class="tool-field">Hours
          <input id="count-h" type="number" inputmode="numeric" min="0" max="99" step="1" value="0">
        </label>
        <label class="tool-field">Minutes
          <input id="count-m" type="number" inputmode="numeric" min="0" max="59" step="1" value="0">
        </label>
        <label class="tool-field">Seconds
          <input id="count-s" type="number" inputmode="numeric" min="0" max="59" step="1" value="0">
        </label>
      </form>
      <p class="watch-time" id="count-time">0:00:00</p>
      <div class="watch-actions">
        <button type="button" class="btn btn-primary" id="count-toggle" aria-pressed="false">Start</button>
        <button type="button" class="btn btn-ghost" id="count-reset" disabled>Reset</button>
        <label class="tool-check"><input id="count-chime" type="checkbox" checked> Chime</label>
      </div>
      <p class="watch-hint">Space starts and pauses. R resets.</p>
      <p id="count-status" class="watch-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <span><a href="/utilities">← Utilities</a></span>
    <span><a href="/">Dan Mullin</a></span>
  </footer>
  <script type="module" src="/src/main.js"></script>
  <script src="/countdown.js" defer></script>
</body>
</html>
